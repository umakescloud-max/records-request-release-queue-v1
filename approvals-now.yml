      - heading "Release review" [level=1] [ref=f2e105]
      - paragraph [ref=f2e106]: Records packets waiting for the specialist's approval before they are released to the requesting firm. Each card shows the chart, the date range and record types, the page count, the itemized bill and the balance from the ledger. No packet goes out without Tessa's click, and a packet with an open exception stays on Exceptions until it is cleared.
